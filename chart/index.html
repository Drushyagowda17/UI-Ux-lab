<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Chart.js</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

</head> <body>
<canvas id="mychart" width="400" height="200"></canvas>
<script>
    var ctx = document.getElementById('mychart').getContext('2d');
    var mychart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Red', 'Blue', 'Green', 'Purple', 'Yellow', 'Orange'],
            datasets: [
                {
                    label: 'Votes',
                    data: [12, 19, 13, 1, 45, 16],
                    backgroundColor: [
                        'rgba(220, 53, 69, 0.2)',
                        'rgba(0, 123, 255, 0.2)',
                        'rgba(40, 167, 69, 0.2)',
                        'rgba(128, 0, 255, 0.2)',
                        'rgba(255, 193, 7, 0.2)',
                        'rgba(255, 128, 0, 0.2)'
                    ],
                    borderColor: [
                        'rgba(220, 53, 69, 1)',
                        'rgba(0, 123, 255, 1)',
                        'rgba(40, 167, 69, 1)',
                        'rgba(128, 0, 255, 1)',
                        'rgba(255, 193, 7, 1)',
                        'rgba(255, 128, 0, 1)'
                    ],
                    borderWidth: 1
                }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
</body>
 </html>
